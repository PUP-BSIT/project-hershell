<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hershive - Login</title>
    <link rel="stylesheet" href="../style/login.css"/>
    <link rel="icon" href="../assets/logo.png"/>
  </head>

  <body>
    <!-- Background particles -->
    <div class="bg-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Hexagonal hive pattern -->
    <div class="hive-pattern">
      <div class="hexagon hex1"></div>
      <div class="hexagon hex2"></div>
      <div class="hexagon hex3"></div>
      <div class="hexagon hex4"></div>
      <div class="hexagon hex5"></div>
      <div class="hexagon hex6"></div>
      <div class="hexagon hex7"></div>
      <div class="hexagon hex8"></div>
    </div>

    <!-- Flying bees -->
    <div class="bee-swarm">
      <div class="bee bee1">🐝</div>
      <div class="bee bee2">🐝</div>
      <div class="bee bee3">🐝</div>
    </div>

    <!-- Main content -->
    <main>
      <div class="left-section">
        <h1>Log in</h1>
        <p>Connect, Share, Explore.</p>
        <div class="image-container">
          <img src="../assets/Login_image.png" alt="Login Design Image" class="login-image">
        </div>
      </div>

      <div class="right-section">
        <div class="login-form-container">
          <h2>Welcome Back!</h2>
          <p>Please enter login details below</p>

          <div id="error" class="error-message"></div>

          <form id="login-form" onsubmit="return validateForm();">
            <div class="input-group">
              <label for="username">Username or Email</label>
              <input type="text" id="username" placeholder="Enter your username or email" required>
            </div>

           <div class="input-group password-group">
              <label for="password">Password</label>
              <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" required>
                <img src="../assets/eye_closed.png"
                     id="togglePassword"
                     alt="Toggle Password"
                     class="eye-icon"
                     onclick="togglePasswordVisibility(this)">
              </div>
            </div>

            <a href="/project-hershell/Hershive/php/forgot_password.php" class="forgot-link">Forgot password?</a>

            <button type="submit" class="login-btn honey-button">
              <span>Log Into Hive</span>
            </button>

            <div class="divider">
              <span>or continue with</span>
            </div>

            <div class="social-login">
              <a href="/project-hershell/Hershive/php/oauth_login.php?provider=devhive" class="social-btn honey-button">
                <img src="../assets/devhive_logo1.jpg" alt="Devhive">
                <span>Devhive</span>
              </a>
              <a href="/project-hershell/Hershive/php/oauth_login.php?provider=heybleepi" class="social-btn honey-button">
                <img src="../assets/heybleepi_logo1.png" alt="HeyBleepi">
                <span>HeyBleepi</span>
              </a>
            </div>

            <p class="register-link">
              Don't have an account?
              <a href="/project-hershell/Hershive/php/register.php">Create here</a>
            </p>
          </form>
        </div>
      </div>
    </main>
    <script src="../script/login.js"></script>
  </body>
</html>
