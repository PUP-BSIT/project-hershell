<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hershive</title>
    <link rel="stylesheet" href="../style/home.css"/>
    <link rel="stylesheet" href="../style/suggestion.css"/>
    <link rel="icon" href="../assets/logo.png"/>

  </head>

  <body>
    <div class="top-bar">
      <img src="../assets/logo.png" alt="hershive logo" class="logo"/>

      <div class="search-bar">
        <input type="text" placeholder="Search"/>
        <button class="search-button">
          <img src="../assets/search_icon.png" alt="search_icon"/>
        </button>
      </div>

      <div class="navigation-icons">
        <button onclick="window.location.href='home.html'">
          <img src="../assets/home_icon.png" alt="home" />
        </button>

        <button onclick="toggleNotificationPanel()" 
                class="notification-wrapper">
          <div class="notification-icon-container">
            <img src="../assets/notification_icon.png" alt="notification"/>
            <span id="notification_count" 
                  class="notification-count hidden">0
            </span>
          </div>
        </button>

        <div class="notification-panel hidden" id="notification_panel">
          <div class="notification-header">
            <h4>Notification</h4>
          </div>
          <div id="notification_container"></div>
        </div>

        <button class="menu-button" onclick="menuToggleDropdown()">☰</button>
      </div>
    </div>

    <div id="menu_dropdown" class="hidden">
      <a href="../php/settings.php" class="menu-dropdown-item">
        <img src="../assets/settings_icon.png" alt="settings"/>
        Settings
      </a>
      <div onclick="toggleLogout()" class="menu-dropdown-item">
        <img src="../assets/logout_icon.png" alt="logout"/>
        <p>Log out</p>
      </div>
    </div>

    <div class="logout-modal-overlay hidden" id="logout_modal">
      <div id="logout">
        <p><strong>Log out of your account?</strong></p>
        <div class="button-holder">
          <button class="cancel-btn" onclick="hideLogout()">Cancel</button>
          <button class="logout-btn" onclick="logout()">Log out</button>
        </div>
      </div>
    </div>

    <div class="main-container">
      <div class="left-contents">
        <h2>Suggestions For You</h2>
        <div id="suggested_users_container">
        </div>
      </div>

      <div class="right-contents">
        <h2>Select people's names to preview their profile.</h2>
        <div class="profile-card hidden">
          <div class="profile-header">
            <button class="close-profile-btn"
                    onclick="closeUserProfile()">
              &times;
            </button>
          </div>

          <div class="profile-banner">
            <img src="../assets/cover_photo.png"
                  alt="Cover Photo" class="cover-img">
            <img src="../assets/temporary_pfp.png"
                  alt="Profile Picture" class="profile-img">
          </div>

          <div class="profile-info">
            <h3 class="profile-fullname"></h3>
            <p class="profile-username"></p>

            <div class="bio-section">
              <p class="profile-bio"></p>
            </div>

            <div class="profile-stats">
              <div onclick="switchTab('post')">
                <strong id="postCount">0</strong><p>Posts</p>
              </div>
              <div onclick="switchTab('followers')">
                <strong id="followerCount">0</strong><p>Followers</p>
              </div>
              <div onclick="switchTab('following')">
                <strong id="followingCount">0</strong><p>Following</p>
              </div>
            </div>
          </div>
          
          <div class="post-divider"></div>
          
          <div class="container">
            <div class="post-section-toggle" id="tabs">
              <div class="tab active" data-tab="post">Post</div>
              <div class="tab" data-tab="followers">Followers</div>
              <div class="tab" data-tab="following">Following</div>
            </div>
          </div>

          <!-- Post Tab Content -->
          <div class="tab-content active" id="post-tab">
            <div id="post-container" class="post-container"></div>
          </div>

          <!-- Following Tab Content -->
          <div class="tab-content" id="following-tab">
            <div class="loading" id="following-loading">
              Loading following...
            </div>
            <div id="following-list" class="user-list"></div>
          </div>

          <!-- Followers Tab Content -->
          <div class="tab-content" id="followers-tab">
            <div class="loading" id="followers-loading">
              Loading followers...
            </div>
            <div id="followers-list" class="user-list"></div>
          </div>

          <!-- Share Modal -->
          <div class="modal-overlay hidden" id="share_modal">
            <div class="share-modal">
              <div class="share-modal-header">
                <h3>Share Post</h3>
                <button class="close-btn" 
                        onclick="closeShareModal()">
                  &times;
                </button>
              </div>
          
              <textarea id="share_message" class="share-textarea"
                  placeholder="Say something about this...">
              </textarea>
          
              <div class="shared-post-preview" id="shared_post_preview">
              </div>

              <input type="hidden" id="shared_post_id">

              <button class="submit-share-btn"
                  onclick="submitShare()">Share</button>

              <div class="share-icons">
                <a href="#" title="DevhiveSpace">
                  <img src="../assets/devhive_logo.jpg" alt="DevhiveSpace"/>
                </a>
                <a href="#" title="Heybleepi">
                  <img src="../assets/heybleepi_logo.png" alt="HeyBleepi"/>
                </a>
              </div>

              <div class="share-link-section">
                <label>Page link</label>
                <div class="link-box">
                  <input
                    type="text"
                    id="share_link"
                    readonly>
                  <button id="copy_link" onclick="copyLink(this)">
                    <img src="../assets/copy_icon.png" alt="Copy"/>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../script/suggestion.js?v=2.2"></script>
  </body>
</html>
